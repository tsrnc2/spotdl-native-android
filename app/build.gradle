plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def releaseSigningFile = file(System.getenv("SPOTDL_NATIVE_KEYSTORE_PROPERTIES") ?: "${System.getProperty('user.home')}/.android/spotdl-native/release.properties")
def releaseSigning = new java.util.Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def hasReleaseSigning = releaseSigning.containsKey("storeFile")

android {
    namespace "com.local.spotdlnative"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.local.spotdlnative"
        minSdk 24
        targetSdk 36
        versionCode 101
        versionName "1.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs-pruned"]
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigning["storeFile"])
                storePassword releaseSigning["storePassword"]
                keyAlias releaseSigning["keyAlias"]
                keyPassword releaseSigning["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.14"
        buildPython "/root/.local/share/pipx/shared/bin/python3.14"
        pip {
            options "--no-deps"
            install "yt-dlp==2026.6.9"
            install "ytmusicapi==1.12.1"
            install "mutagen==1.48.1"
            install "requests==2.34.2"
            install "urllib3==2.7.0"
            install "charset-normalizer==3.4.7"
            install "idna==3.18"
            install "certifi==2026.6.17"
            install "spotipy==2.26.0"
            install "spotipyfree==1.9.13"
            install "beautifulsoup4==4.15.0"
            install "soupsieve==2.8.4"
            install "typing-extensions==4.15.0"
            install "python-slugify==8.0.4"
            install "text-unidecode==1.3"
            install "Unidecode==1.4.0"
            install "pykakasi==2.3.0"
            install "jaconv==0.5.0"
            install "Deprecated==1.3.1"
            install "wrapt==2.2.2"
            install "rich==13.9.4"
            install "markdown-it-py==4.2.0"
            install "mdurl==0.1.2"
            install "Pygments==2.20.0"
        }
        extractPackages "spotdl", "yt_dlp"
    }
}
